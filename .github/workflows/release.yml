name: Release

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.0, v0.1.2, etc.
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  release:
    permissions:
      contents: write # Needed to create and attach files to GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Linux requires WebKit and GUI dependencies to compile Tauri
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kamiseta ${{ github.ref_name }}'
          releaseBody: 'See the assets to download for your OS.'
          releaseDraft: false
          prerelease: false